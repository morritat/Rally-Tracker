<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Этап — Rally Stage Tracker</title>
<link rel="stylesheet" href="../static/css/style.css">

</head>
<body>

<header>
    <div class="logo">RALLY <span class="red">STAGE</span> TRACKER</div>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    <nav id="nav"><ul>
        <li><a href="index.html">Этапы</a></li>
        <li><a href="stage.html" class="active">Детали</a></li>
        <li><a href="admin.html">Админ</a></li>
        <li><a href="login.html" class="btn-nav">Вход</a></li>
    </ul></nav>
</header>
<div class="overlay" id="overlay"></div>

<div>
<div class="detail-hero"><h1 id="stageName">Загрузка...</h1><div class="detail-meta" id="stageMeta"><span>Загрузка данных этапа...</span></div></div>
<div class="weather-panel" id="stageLiveWeather" style="max-width:1400px;margin:1.5rem auto;padding:1.35rem 1.5rem"><div class="weather-heading">Актуальная погода · этап</div><div class="weather-loading">Загрузка актуальной погоды...</div></div>
<div class="tabs"><button class="tab-btn active" onclick="switchTab('results')">Результаты</button><button class="tab-btn" onclick="switchTab('telemetry')">Телеметрия</button><button class="tab-btn" onclick="switchTab('radio')">Радио</button><button class="tab-btn" onclick="switchTab('video')">Видео</button></div>
<div id="tab-results" class="tab-content active"><div id="resultsAccess" class="restricted-content"></div><table class="st-table" id="resultsTable" style="display:none"><thead><tr><th>Поз</th><th>Экипаж</th><th>Авто</th><th>Время</th><th>Штраф</th><th>Итого</th></tr></thead><tbody id="resultsBody"></tbody></table></div>
<div id="tab-telemetry" class="tab-content"><div id="telemetryContent" class="restricted-content"></div></div><div id="tab-radio" class="tab-content"><div id="radioContent" class="restricted-content"></div></div><div id="tab-video" class="tab-content"><div id="videoContent" class="restricted-content"></div></div>
</div>
<footer>
    <div class="footer-content">
        <div class="footer-logo">RALLY <span class="red">STAGE</span> TRACKER</div>
        <div class="footer-copy">© 2026 Rally Stage Tracker. Все права защищены.</div>
        <div class="footer-socials">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
    </div>
</footer>

<script src="/static/js/stage.js"></script>
<script>
const ham=document.getElementById('hamburger'),nav=document.getElementById('nav'),ov=document.getElementById('overlay');
ham.addEventListener('click',()=>{ham.classList.toggle('active');nav.classList.toggle('open');ov.classList.toggle('show')});
ov.addEventListener('click',()=>{ham.classList.remove('active');nav.classList.remove('open');ov.classList.remove('show')});

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('tab-' + tabName).classList.add('active');
}
</script>
</body>
</html>
